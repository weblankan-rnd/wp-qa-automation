name: Live QA Scan

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  smoke-test:
    if: secrets.LIVE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:live
        env:
          BASE_URL: ${{ secrets.LIVE_URL }}
          ENVIRONMENT: live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/html/
