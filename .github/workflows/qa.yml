name: QA

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run all 5 browsers (Chrome, Firefox, Safari, Mobile)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      base_url:
        description: 'Target URL (leave blank for default)'
        required: false
        default: 'https://www.weblankan.com'
      pages:
        description: 'Pages to test — comma separated (e.g. /,/about-us/,/contact-us/). Leave blank to use defaults.'
        required: false
        default: '/'
      accessibility_impact:
        description: 'Min accessibility impact to fail on'
        required: false
        default: 'critical'
        type: choice
        options:
          - 'critical'
          - 'serious'
          - 'moderate'

jobs:
  # ── Smoke Tests ──────────────────────────────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: |
          if [ "${{ inputs.full_matrix || 'false' }}" = "true" ]; then
            npx playwright install --with-deps
          else
            npx playwright install chromium --with-deps
          fi

      - name: Write page cache from input
        run: |
          mkdir -p test-data
          node -e "
            const raw = '${{ inputs.pages || github.event.inputs.pages || '/' }}';
            const pages = raw.split(',').map(p => p.trim()).filter(p => p.startsWith('/'));
            require('fs').writeFileSync('test-data/.page-cache.json', JSON.stringify(pages));
            console.log('Pages to test (' + pages.length + '):', pages.join(', '));
          "

      - name: Run tests
        id: tests
        run: npx playwright test
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url || github.event.inputs.base_url || 'https://www.weblankan.com' }}
          FULL_MATRIX: ${{ inputs.full_matrix || 'false' }}
          SKIP_PAGE_DISCOVERY: 'true'
          ACCESSIBILITY_IMPACT: ${{ inputs.accessibility_impact || 'critical' }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/html/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/test-results/
          retention-days: 7

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Test summary
        if: always()
        run: |
          echo "## ⚙️ QA Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ inputs.base_url || 'https://www.weblankan.com' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser matrix:** ${{ inputs.full_matrix == 'true' && 'Full (5 browsers)' || 'Chrome only' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Accessibility impact:** ${{ inputs.accessibility_impact || 'critical' }}" >> $GITHUB_STEP_SUMMARY

  # ── Lighthouse Performance Budgets (optional) ───────────────────────────────
  lighthouse:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Lighthouse CI
        run: npx lhci autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          BASE_URL: ${{ inputs.base_url || 'https://www.weblankan.com' }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
