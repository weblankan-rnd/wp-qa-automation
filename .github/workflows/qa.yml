name: QA

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run all 5 browsers (Chrome, Firefox, Safari, Mobile)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      base_url:
        description: 'Target URL (leave blank for default)'
        required: false
        default: 'https://supercorals.hostweblankan.in'
      pages:
        description: 'Pages to test — comma separated (e.g. /,/about-us/,/contact-us/). Leave blank to use defaults.'
        required: false
        default: '/,/about-us/,/accommodation/,/excursions/,/restaurant-and-bar/,/special-offers/,/gallery/,/contact-us/'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: |
          if [ "${{ inputs.full_matrix }}" = "true" ]; then
            npx playwright install --with-deps
          else
            npx playwright install chromium --with-deps
          fi

      - name: Write page cache from input
        run: |
          mkdir -p test-data
          node -e "
            const raw = '${{ inputs.pages }}';
            const pages = raw.split(',').map(p => p.trim()).filter(p => p.startsWith('/'));
            require('fs').writeFileSync('test-data/.page-cache.json', JSON.stringify(pages));
            console.log('Pages to test (' + pages.length + '):', pages.join(', '));
          "

      - name: Run tests
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://supercorals.hostweblankan.in' }}
          FULL_MATRIX: ${{ inputs.full_matrix || 'false' }}
          SKIP_PAGE_DISCOVERY: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/html/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/test-results/
          retention-days: 7
